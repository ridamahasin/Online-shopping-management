
<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            color: darkblue;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .product {
            background: white;
            padding: 15px;
            border-radius: 10px;
            width: 220px;
        }

        img {
            width: 180px;
            height: 150px;
        }

        button {
            background: green;
            color: white;
            padding: 10px;
            border: none;
        }
    </style>
</head>

<body>

    <h1>Online Shopping Store</h1>
    <h2>Available Products</h2>

    <div class="products">

        <div class="product">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400">
            <h3>Sports Shoes</h3>
            <p>Price: ₹1500</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400">
            <h3>Headphones</h3>
            <p>Price: ₹999</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400">
            <h3>Watch</h3>
            <p>Price: ₹2000</p>
            <button>Add to Cart</button>
        </div>

    </div>

</body>
</html>
